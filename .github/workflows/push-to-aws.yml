name: Build and Deploy to Amazon ECR/EKS

on:
  push:
    branches: [ "dev" ]

env:
  AWS_REGION: us-east-1                   # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: cc-mooninsurance           # set this to your Amazon ECR repository name


jobs:
  deploy:
    name: Build and Deploy to Amazon ECR/EKS
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG:  ${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        for service in agent integration sales branch; do
          cd $service
          IMAGE_TAG="$service-img-v1"
          docker build --no-cache -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          cd ..
        done

    - name: Waiting task for 60 Seconds
      run: sleep 60

    - name: Update Kubeconfig for CLI
      run: |
        aws eks update-kubeconfig --name moonagenttracker --region ${{ env.AWS_REGION }}

    - name: Rollout Kubernetes Artifacts to EKS
      id: rollout-builds
      run: |
        kubectl apply -f deployments/agent_service_deployment.yml
#        kubectl apply -f deployments/branch_service_deployment.yml
#        kubectl apply -f deployments/integration_service_deployment.yml
#        kubectl apply -f deployments/sales_service_deployment.yml
#        kubectl apply -f deployments/ingress_deployment.yml
