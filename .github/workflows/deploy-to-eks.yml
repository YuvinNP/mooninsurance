name: Rollout to Amazon EKS

on:
  workflow_run:
    workflows: ["Deploy to Amazon ECR"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cc-mooninsurance

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update Kubeconfig for CLI
      run: |
        aws eks update-kubeconfig --name moonagenttracker --region ${{ env.AWS_REGION }}

    - name: Rollout Kubernetes Artifacts to EKS
      id: rollout-builds
      run: |
        kubectl apply -f deployments/agent-service_deployment.yml
        kubectl apply -f deployments/branch-service_deployment.yml
        kubectl apply -f deployments/integration-service_deployment.yml
        kubectl apply -f deployments/sales-service_deployment.yml
        kubectl apply -f deployments/ingress_deployment.yml
        
